# Render Blueprint: one always-on web service that serves the site and the dalang API.
# Secrets use `sync: false`: set them in the Render dashboard, never in this file.
services:
  - type: web
    name: bayang-eyang
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DALANG_PROVIDER
        value: digitalocean
      - key: DALANG_DAILY_BUDGET_USD
        value: "0.50"
      - key: DALANG_MODEL
        sync: false
      - key: DO_INFERENCE_URL
        sync: false
      - key: DO_INFERENCE_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
