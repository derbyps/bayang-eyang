# Render Blueprint: one always-on web service that serves the site and the dalang API.
# Secrets use `sync: false`: set them in the Render dashboard, never in this file.
services:
  - type: web
    name: bayang-eyang
    runtime: node
    plan: starter
    region: singapore
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DALANG_PROVIDER
        value: cloudflare
      - key: DALANG_MODEL
        value: "@cf/google/gemma-4-26b-a4b-it"
      # Just under Cloudflare's free 10,000 neurons a day, so visitors see "the dalang is resting" instead of errors.
      - key: DALANG_DAILY_BUDGET_USD
        value: "0.10"
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_API_TOKEN
        sync: false
      - key: SENTRY_DSN
        sync: false
